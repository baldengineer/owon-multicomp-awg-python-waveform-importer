usb_resource = "USB0::0x5345::0x1235::2025332::INSTR"  # SOCKET/LAN does not work for bulk transfer
timeout_ms = 60000
expected_identity_prefix = "Newark,MP750290" # Can also be an OWON XDG3000, or leave blank
max_point_count = 100000 # Remote interface limited to 100k
max_dac_code = 16383

# Safe Defaults
frequency_hz = 1000.0  
voltage_vpp = 1.0
offset_voltage = 0.0
channel = 1
enable_output = false
persist = true
